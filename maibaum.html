<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maibaum ✨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(170deg, #1565C0 0%, #42A5F5 35%, #87CEEB 65%, #A5D6A7 85%, #4CAF50 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            font-family: Georgia, serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        h1 {
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.45), 0 0 24px rgba(255,220,0,0.65);
            margin: 14px 0 4px;
            font-size: 2em;
            letter-spacing: 3px;
        }
        #hint {
            color: rgba(255,255,255,0.92);
            font-size: 0.84em;
            margin-bottom: 6px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.35);
            animation: glow 2.2s ease-in-out infinite;
        }
        @keyframes glow {
            0%,100% { opacity: 0.65; }
            50%      { opacity: 1; text-shadow: 0 0 12px rgba(255,220,0,0.9), 1px 1px 4px rgba(0,0,0,0.35); }
        }
        canvas { cursor: pointer; display: block; touch-action: none; }
    </style>
</head>
<body>
    <h1>🌸 Maibaum 🌸</h1>
    <div id="hint">✨ Antippen zum Farbwechsel &amp; Herzchen! ✨</div>
    <canvas id="c"></canvas>

<script>
(() => {
    const cv = document.getElementById('c');
    const g  = cv.getContext('2d');
    const W  = cv.width  = Math.min(window.innerWidth,  460);
    const H  = cv.height = Math.min(window.innerHeight - 95, 600);

    const MX = W / 2;
    const PT = H * 0.07;          // pole top y
    const PB = H * 0.93;          // pole bottom y
    const PH = PB - PT;
    const PW = Math.max(12, W * 0.038);

    /* ── Color palettes ─────────────────────────────── */
    const PALS = [
        ['#E53935','#FDD835','#1E88E5','#43A047','#F06292'],
        ['#FF7043','#26C6DA','#AB47BC','#66BB6A','#FFA726'],
        ['#EC407A','#42A5F5','#FFEE58','#26A69A','#EF9A9A'],
        ['#7C4DFF','#40C4FF','#FFD740','#69F0AE','#FF80AB'],
        ['#D500F9','#00E5FF','#CCFF90','#FF6D00','#76FF03'],
    ];

    let pal = 0, npal = 0, tr = 1;   // tr: transition 0→1

    /* ── Glitter particles ──────────────────────────── */
    const glitters = [];
    function mkGlitter() {
        return {
            x:   MX + (Math.random() - 0.5) * W * 0.7,
            y:   PT + Math.random() * PH,
            sz:  Math.random() * 2.8 + 0.7,
            hue: Math.random() * 360,
            ph:  Math.random() * 6.28,
            sp:  Math.random() * 1.3 + 0.4,
            vy: -(Math.random() * 0.65 + 0.15),
        };
    }
    for (let i = 0; i < 95; i++) glitters.push(mkGlitter());

    /* ── Hearts ─────────────────────────────────────── */
    const hearts = [];
    function mkHeart(x, y) {
        return {
            x, y,
            vx:  (Math.random() - 0.5) * 9,
            vy: -(Math.random() * 5.5 + 2),
            sz:   Math.random() * 18 + 8,
            hue:  Math.random() < 0.75 ? 338 + Math.random() * 28 : 28 + Math.random() * 18,
            op:   1,
            rot:  (Math.random() - 0.5) * 0.45,
            rv:   (Math.random() - 0.5) * 0.09,
        };
    }

    /* ── Color helpers ──────────────────────────────── */
    function hex2rgb(h) {
        return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
    }
    function blendColor(i) {
        if (tr >= 1) return PALS[pal][i % 5];
        const [r1,g1_,b1] = hex2rgb(PALS[pal][i%5]);
        const [r2,g2,b2]  = hex2rgb(PALS[npal][i%5]);
        return `rgb(${Math.round(r1+(r2-r1)*tr)},${Math.round(g1_+(g2-g1_)*tr)},${Math.round(b1+(b2-b1)*tr)})`;
    }

    /* ── Draw: 4-pointed sparkle ────────────────────── */
    function drawSparkle(x, y, r, hue, op) {
        g.save();
        g.globalAlpha   = op;
        const col       = `hsl(${hue},100%,78%)`;
        g.fillStyle     = col;
        g.shadowColor   = col;
        g.shadowBlur    = 9;
        g.beginPath();
        for (let i = 0; i < 4; i++) {
            const a = (i / 4) * 6.2832, b = a + 0.7854;
            i === 0
                ? g.moveTo(x + Math.cos(a)*r*2.2, y + Math.sin(a)*r*2.2)
                : g.lineTo(x + Math.cos(a)*r*2.2, y + Math.sin(a)*r*2.2);
            g.lineTo(x + Math.cos(b)*r*0.38, y + Math.sin(b)*r*0.38);
        }
        g.closePath();
        g.fill();
        g.restore();
    }

    /* ── Draw: heart ────────────────────────────────── */
    function drawHeart(h) {
        g.save();
        g.translate(h.x, h.y);
        g.rotate(h.rot);
        g.globalAlpha   = h.op;
        const s         = h.sz;
        const col       = `hsl(${h.hue},100%,60%)`;
        g.fillStyle     = col;
        g.shadowColor   = `hsl(${h.hue},100%,70%)`;
        g.shadowBlur    = 13;
        g.beginPath();
        g.moveTo(0, -s * 0.35);
        g.bezierCurveTo(-s*0.85, -s*1.15, -s*1.6, 0.05*s, 0, s);
        g.bezierCurveTo( s*1.6,  0.05*s,   s*0.85, -s*1.15, 0, -s * 0.35);
        g.fill();
        // shine highlight
        g.globalAlpha   = h.op * 0.35;
        g.fillStyle     = '#fff';
        g.shadowBlur    = 0;
        g.beginPath();
        g.ellipse(-s*0.28, -s*0.55, s*0.22, s*0.13, -0.6, 0, 6.28);
        g.fill();
        g.restore();
    }

    /* ── Draw: one ribbon ───────────────────────────── */
    function drawRibbon(ri, N, t) {
        const col      = blendColor(ri);
        const startA   = (ri / N) * 6.2832;
        const turns    = 2.3;
        const steps    = 72;
        g.beginPath();
        for (let i = 0; i <= steps; i++) {
            const tt  = i / steps;
            const a   = startA + tt * turns * 6.2832;
            const y   = PT + tt * PH;
            const r   = PW * 0.6 + W * 0.33 * Math.pow(tt, 0.68);
            const wx  = Math.sin(a + t * 1.1) * 9 * tt;
            const x   = MX + Math.cos(a) * r + wx;
            i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
        }
        g.strokeStyle  = col;
        g.lineWidth    = 4.5 + Math.sin(startA + t) * 1.5;
        g.lineCap      = 'round';
        g.lineJoin     = 'round';
        g.shadowColor  = col;
        g.shadowBlur   = 11;
        g.stroke();
        g.shadowBlur   = 0;
    }

    /* ── Draw: small flower ─────────────────────────── */
    function drawFlower(x, y, r, col) {
        for (let p = 0; p < 5; p++) {
            const a = (p / 5) * 6.2832;
            g.fillStyle = col;
            g.beginPath();
            g.ellipse(x + Math.cos(a)*r, y + Math.sin(a)*r, r, r*0.58, a, 0, 6.28);
            g.fill();
        }
        g.fillStyle = '#FFF176';
        g.beginPath();
        g.arc(x, y, r * 0.48, 0, 6.28);
        g.fill();
    }

    /* ── Main scene ─────────────────────────────────── */
    function scene(t) {
        const N = 6;

        /* ground */
        const gg = g.createLinearGradient(0, PB-12, 0, H);
        gg.addColorStop(0, '#43A047');
        gg.addColorStop(1, '#1B5E20');
        g.fillStyle = gg;
        g.fillRect(0, PB - 12, W, H - PB + 12);

        /* grass tufts */
        g.fillStyle = '#2E7D32';
        for (let x = 4; x < W; x += 17) {
            const jitter = Math.sin(x * 0.3 + t) * 2;
            g.beginPath();
            g.moveTo(x, PB - 10);
            g.lineTo(x + 4, PB - 18 + jitter);
            g.lineTo(x + 8, PB - 10);
            g.fill();
        }

        /* pole shadow */
        g.save();
        g.globalAlpha = 0.13;
        g.fillStyle   = '#000';
        g.beginPath();
        g.ellipse(MX + PW, PB - 2, PW*2.2, 7, 0, 0, 6.28);
        g.fill();
        g.restore();

        /* ribbons BEHIND pole (cos < 0 at start angle) */
        for (let ri = 0; ri < N; ri++) {
            if (Math.cos((ri/N)*6.2832) < 0) drawRibbon(ri, N, t);
        }

        /* ── pole ── */
        const pg = g.createLinearGradient(MX - PW/2, 0, MX + PW/2, 0);
        pg.addColorStop(0,    '#3E2723');
        pg.addColorStop(0.25, '#8D6E63');
        pg.addColorStop(0.55, '#D7CCC8');
        pg.addColorStop(0.82, '#8D6E63');
        pg.addColorStop(1,    '#3E2723');
        g.fillStyle = pg;
        g.fillRect(MX - PW/2, PT, PW, PH);

        /* gold rings on pole */
        for (let y = PT + 55; y < PB; y += 95) {
            const rg = g.createLinearGradient(MX - PW/2, 0, MX + PW/2, 0);
            rg.addColorStop(0,   '#7B5800');
            rg.addColorStop(0.5, '#FFD700');
            rg.addColorStop(1,   '#7B5800');
            g.fillStyle = rg;
            g.fillRect(MX - PW/2 - 2, y - 5, PW + 4, 9);
        }

        /* ribbons IN FRONT of pole */
        for (let ri = 0; ri < N; ri++) {
            if (Math.cos((ri/N)*6.2832) >= 0) drawRibbon(ri, N, t);
        }

        /* ── wreath ── */
        const wy = PT + 16, wr = PW * 2.3;
        g.lineWidth   = 14;
        g.strokeStyle = '#1B5E20';
        g.shadowColor = '#2E7D32';
        g.shadowBlur  = 5;
        g.beginPath(); g.arc(MX, wy, wr, 0, 6.28); g.stroke();
        g.shadowBlur  = 0;
        g.lineWidth   = 7;
        g.strokeStyle = '#4CAF50';
        g.beginPath(); g.arc(MX, wy, wr, 0, 6.28); g.stroke();

        const FC = ['#FF69B4','#FF4500','#FFD700','#FF1493','#DA70D6','#FF6347','#BA55D3','#FF69B4','#FF4500','#FFFDE7'];
        for (let i = 0; i < 10; i++) {
            const a  = (i / 10) * 6.2832;
            const fx = MX + Math.cos(a) * wr;
            const fy = wy + Math.sin(a) * wr;
            drawFlower(fx, fy, 5, FC[i % FC.length]);
        }

        /* ── top ornament ── */
        const ty = PT - PW * 2.9, tr2 = PW * 1.85;
        const og = g.createRadialGradient(MX - tr2*0.3, ty - tr2*0.3, tr2*0.08, MX, ty, tr2);
        og.addColorStop(0,   '#FFFDE7');
        og.addColorStop(0.5, '#FFD700');
        og.addColorStop(1,   '#E65100');
        g.fillStyle   = og;
        g.shadowColor = '#FFD700';
        g.shadowBlur  = 22;
        g.beginPath(); g.arc(MX, ty, tr2, 0, 6.28); g.fill();
        g.shadowBlur  = 0;

        /* star on ball */
        g.fillStyle = 'rgba(255,255,255,0.88)';
        g.beginPath();
        for (let i = 0; i < 5; i++) {
            const a  = (i/5)*6.2832 - 1.5708;
            const ia = a + 0.6283;
            i === 0
                ? g.moveTo(MX + Math.cos(a)*tr2*0.76, ty + Math.sin(a)*tr2*0.76)
                : g.lineTo(MX + Math.cos(a)*tr2*0.76, ty + Math.sin(a)*tr2*0.76);
            g.lineTo(MX + Math.cos(ia)*tr2*0.33, ty + Math.sin(ia)*tr2*0.33);
        }
        g.closePath(); g.fill();
    }

    /* ── Animation loop ─────────────────────────────── */
    let time = 0;
    function loop() {
        requestAnimationFrame(loop);
        g.clearRect(0, 0, W, H);
        time += 0.018;

        /* advance palette transition */
        if (tr < 1) {
            tr = Math.min(1, tr + 0.028);
            if (tr >= 1) pal = npal;
        }

        scene(time);

        /* glitter */
        for (const p of glitters) {
            p.y += p.vy;
            if (p.y < PT - 28) {
                p.y = PB;
                p.x = MX + (Math.random() - 0.5) * W * 0.72;
                p.hue = Math.random() * 360;
            }
            const op = (Math.sin(p.ph + time * p.sp) + 1) * 0.48;
            drawSparkle(p.x, p.y, p.sz, p.hue, op);
        }

        /* hearts */
        for (let i = hearts.length - 1; i >= 0; i--) {
            const h = hearts[i];
            h.x  += h.vx; h.y  += h.vy;
            h.vy += 0.13;  h.vx *= 0.985;
            h.rot += h.rv; h.op  -= 0.011;
            if (h.op <= 0) { hearts.splice(i, 1); continue; }
            drawHeart(h);
        }
    }

    /* ── Input ──────────────────────────────────────── */
    function onTap(e) {
        e.preventDefault();
        npal = (pal + 1) % PALS.length;
        tr   = 0;

        const rect = cv.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

        for (let i = 0; i < 18; i++) hearts.push(mkHeart(x, y));
    }

    cv.addEventListener('click',      onTap);
    cv.addEventListener('touchstart', onTap, { passive: false });

    loop();
})();
</script>
</body>
</html>
