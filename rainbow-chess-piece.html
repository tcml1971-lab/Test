<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regenbogen-Schachfigur</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a1a;
            overflow: hidden;
            font-family: sans-serif;
        }

        .scene {
            perspective: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chess-piece-container {
            animation: spin 4s linear infinite;
            transform-style: preserve-3d;
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.3));
        }

        .chess-piece {
            font-size: 180px;
            line-height: 1;
            background: linear-gradient(
                45deg,
                #ff0000,
                #ff7700,
                #ffff00,
                #00ff00,
                #0000ff,
                #8b00ff,
                #ff0000
            );
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation:
                rainbow-shift 3s ease infinite,
                glow-pulse 2s ease-in-out infinite alternate;
            text-shadow: none;
            position: relative;
        }

        .chess-piece::before {
            content: "\265A";
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            background: none;
            -webkit-text-fill-color: transparent;
            filter: blur(20px);
            opacity: 0.8;
            background: linear-gradient(
                45deg,
                #ff0000,
                #ff7700,
                #ffff00,
                #00ff00,
                #0000ff,
                #8b00ff,
                #ff0000
            );
            background-size: 400% 400%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: rainbow-shift 3s ease infinite;
        }

        .glow-ring {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid transparent;
            background: conic-gradient(
                from 0deg,
                #ff0000, #ff7700, #ffff00, #00ff00,
                #0000ff, #8b00ff, #ff0000
            ) border-box;
            -webkit-mask:
                linear-gradient(#fff 0 0) padding-box,
                linear-gradient(#fff 0 0);
            mask:
                linear-gradient(#fff 0 0) padding-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: ring-rotate 3s linear infinite;
            opacity: 0.6;
        }

        .glow-ring:nth-child(2) {
            width: 290px;
            height: 290px;
            animation: ring-rotate 4s linear infinite reverse;
            opacity: 0.3;
            border-width: 2px;
        }

        .wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Shadow on the ground */
        .shadow {
            width: 120px;
            height: 30px;
            background: radial-gradient(ellipse, rgba(255,255,255,0.15), transparent 70%);
            border-radius: 50%;
            margin-top: 10px;
            animation: shadow-pulse 2s ease-in-out infinite alternate;
        }

        /* Floating particles */
        .particles {
            position: absolute;
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: float-up 3s ease-in-out infinite;
        }

        .particle:nth-child(1) { left: 10%; top: 80%; background: #ff0000; animation-delay: 0s; }
        .particle:nth-child(2) { left: 25%; top: 70%; background: #ff7700; animation-delay: 0.4s; }
        .particle:nth-child(3) { left: 40%; top: 85%; background: #ffff00; animation-delay: 0.8s; }
        .particle:nth-child(4) { left: 55%; top: 75%; background: #00ff00; animation-delay: 1.2s; }
        .particle:nth-child(5) { left: 70%; top: 80%; background: #0000ff; animation-delay: 1.6s; }
        .particle:nth-child(6) { left: 85%; top: 70%; background: #8b00ff; animation-delay: 2.0s; }
        .particle:nth-child(7) { left: 50%; top: 90%; background: #ff0077; animation-delay: 2.4s; }
        .particle:nth-child(8) { left: 15%; top: 60%; background: #00ffff; animation-delay: 0.6s; }
        .particle:nth-child(9) { left: 80%; top: 65%; background: #ff00ff; animation-delay: 1.0s; }
        .particle:nth-child(10) { left: 35%; top: 55%; background: #77ff00; animation-delay: 1.8s; }

        @keyframes spin {
            0%   { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        @keyframes rainbow-shift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes glow-pulse {
            0%   { filter: brightness(1) drop-shadow(0 0 10px rgba(255,100,100,0.5)); }
            33%  { filter: brightness(1.2) drop-shadow(0 0 20px rgba(100,255,100,0.5)); }
            66%  { filter: brightness(1.1) drop-shadow(0 0 15px rgba(100,100,255,0.5)); }
            100% { filter: brightness(1.3) drop-shadow(0 0 25px rgba(255,100,255,0.5)); }
        }

        @keyframes ring-rotate {
            0%   { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes shadow-pulse {
            0%   { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0.2; }
        }

        @keyframes float-up {
            0%   { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120px) scale(0); opacity: 0; }
        }

        h1 {
            color: #fff;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 30px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="chess-piece-container">
            <div class="wrapper">
                <div class="glow-ring"></div>
                <div class="glow-ring"></div>
                <div class="particles">
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                </div>
                <div class="chess-piece">&#9812;</div>
            </div>
        </div>
        <div class="shadow"></div>
        <h1>Rainbow Chess</h1>
    </div>
</body>
</html>
