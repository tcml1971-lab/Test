<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mops Rettung!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;

    }
    #gameCanvas {
      display: block;
      touch-action: none;
    }

<body>
<canvas id="gameCanvas"></canvas>
<script>
// ================================================
//   MOPS RETTUNG! – Ein Game & Wuff Klassiker
//   Inspiriert von Nintendo Game & Watch "Fire"
// ================================================

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// ----- Layout & Constants -----
const W = 360, H = 640;

const GROUND_Y       = 535;
const TRAMP_Y        = 512;
const TRAMP_W        = 124;
const TRAMP_H        = 18;
const TRAMP_MIN_X    = 22;
const TRAMP_MAX_X    = W - 22 - TRAMP_W;   // 214
const TRAMP_SPEED    = 5.5;

const BUILDING_X     = 222;
const BUILDING_Y     = 75;
const BUILDING_W     = 138;
const BUILDING_H     = 440;

const AMBULANCE_X    = 4;
const AMBULANCE_Y    = 452;
const AMBULANCE_W    = 102;
const AMBULANCE_H    = 68;

// Window positions (spawn points for pugs)
const WINDOWS = [];
for (let row = 0; row < 4; row++) {
  for (let col = 0; col < 3; col++) {
    WINDOWS.push({
      x: BUILDING_X + 14 + col * 38,
      y: BUILDING_Y + 28 + row * 68,
    });
  }
}

// ----- Audio (Web Audio API) -----
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, type, duration, gain = 0.3) {
  try {
    const ac  = getAudio();
    const osc = ac.createOscillator();
    const gn  = ac.createGain();
    osc.connect(gn); gn.connect(ac.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    gn.gain.setValueAtTime(gain, ac.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
    osc.start(); osc.stop(ac.currentTime + duration);
  } catch(e) {}
}
function sfxBounce()  { playTone(320,'sine',0.12,0.25); playTone(480,'sine',0.08,0.15); }
function sfxSave()    { [600,800,1000].forEach((f,i) => setTimeout(() => playTone(f,'sine',0.15,0.2), i*60)); }
function sfxMiss()    { playTone(120,'sawtooth',0.3,0.35); }
function sfxLevelUp() { [400,500,600,800].forEach((f,i) => setTimeout(() => playTone(f,'square',0.12,0.18), i*80)); }
function sfxStart()   { [300,400,500,700].forEach((f,i) => setTimeout(() => playTone(f,'sine',0.18,0.22), i*70)); }

// ----- roundRect polyfill -----
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r, y);
    this.lineTo(x+w-r, y);
    this.quadraticCurveTo(x+w, y, x+w, y+r);
    this.lineTo(x+w, y+h-r);
    this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    this.lineTo(x+r, y+h);
    this.quadraticCurveTo(x, y+h, x, y+h-r);
    this.lineTo(x, y+r);
    this.quadraticCurveTo(x, y, x+r, y);
    this.closePath();
    return this;
  };
}

// ----- Canvas resize -----
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.width  = W;
  canvas.height = H;
  canvas.style.width  = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ----- Game State -----
let state        = 'menu';
let score        = 0;
let highScore    = parseInt(localStorage.getItem('mopsHigh') || '0');
let lives        = 3;
let level        = 1;
let frame        = 0;
let spawnTimer   = 0;
let spawnEvery   = 148;
let missedCount  = 0;

// ----- Trampoline -----
const tramp = {
  x: W/2 - TRAMP_W/2,
  y: TRAMP_Y,
  bounce: 0,
  leftDown:  false,
  rightDown: false,
};

// ----- Stars -----
const STARS = Array.from({length: 55}, () => ({
  x:     Math.random() * W,
  y:     Math.random() * (BUILDING_Y + 60),
  r:     Math.random() * 1.4 + 0.4,
  phase: Math.random() * Math.PI * 2,
  speed: Math.random() * 0.04 + 0.02,
}));

// ----- Particles -----
let particles = [];
function addParticles(x, y, colors, n = 10) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 35, max: 35,
      color: colors[Math.floor(Math.random() * colors.length)],
      size:  Math.random() * 4 + 1.5,
    });
  }
}

// ----- Floating texts -----
let floats = [];
function addFloat(x, y, text, color) {
  floats.push({ x, y, text, color, life: 55, max: 55 });
}

// ----- Pug Class -----
class Pug {
  constructor(win) {
    this.x       = win.x + 15;
    this.y       = win.y + 12;
    this.vx      = 0;
    this.vy      = 0.4;
    this.state   = 'falling';
    this.rot     = 0;
    this.vrot    = (Math.random() - 0.5) * 0.08;
    this.alpha   = 1;
    this.counted = false;
    this.gravity = 0.28 + level * 0.018;
    this.frame   = 0;
  }

  update() {
    this.frame++;
    if (this.state === 'falling') {
      this.vy  += this.gravity;
      this.y   += this.vy;
      this.rot += this.vrot;
      if (this.y >= GROUND_Y - 4) {
        this.y     = GROUND_Y - 4;
        this.state = 'missed';
      }
    }
    if (this.state === 'bouncing') {
      this.vy  += 0.45;
      this.x   += this.vx;
      this.y   += this.vy;
      this.rot += this.vrot * 0.7;
      if (
        this.x > AMBULANCE_X - 12 &&
        this.x < AMBULANCE_X + AMBULANCE_W + 12 &&
        this.y > AMBULANCE_Y - 15 &&
        this.y < GROUND_Y
      ) {
        this.state = 'saved';
      }
      if (this.y > GROUND_Y + 20 || this.x < -60) {
        this.state = 'missed';
      }
    }
    if (this.state === 'missed' || this.state === 'saved') {
      this.alpha -= 0.045;
    }
  }

  consume() {
    if (this.counted) return null;
    this.counted = true;
    return this.state;
  }

  done()  { return this.alpha <= 0; }

  draw() {
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    drawPug(this.state, this.frame);
    ctx.restore();
  }
}

// ----- Draw Pug -----
function drawPug(pugState, f) {
  const leg = Math.sin(f * 0.35) * 4;

  // Body
  ctx.fillStyle = '#D4A96A';
  ctx.beginPath();
  ctx.ellipse(0, 6, 13, 17, 0, 0, Math.PI*2);
  ctx.fill();

  // Tail
  ctx.save();
  ctx.strokeStyle = '#B8894A';
  ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(11, -1, 7, Math.PI*0.6, Math.PI*2.1);
  ctx.stroke();
  ctx.restore();

  // Back legs
  ctx.fillStyle = '#C4996A';
  ctx.beginPath();
  ctx.ellipse(-7, 20 + leg*0.5, 4, 7, -0.25, 0, Math.PI*2);
  ctx.ellipse( 7, 20 - leg*0.5, 4, 7,  0.25, 0, Math.PI*2);
  ctx.fill();

  // Head
  ctx.fillStyle = '#D4A96A';
  ctx.beginPath();
  ctx.arc(0, -13, 15, 0, Math.PI*2);
  ctx.fill();

  // Ears
  ctx.fillStyle = '#8B6030';
  ctx.beginPath();
  ctx.ellipse(-11, -24, 6.5, 9, -0.45, 0, Math.PI*2);
  ctx.ellipse( 11, -24, 6.5, 9,  0.45, 0, Math.PI*2);
  ctx.fill();

  // Face mask
  ctx.fillStyle = '#7A5025';
  ctx.beginPath();
  ctx.ellipse(0, -11, 10, 9.5, 0, 0, Math.PI*2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-5.5, -15, 5.5, 0, Math.PI*2);
  ctx.arc( 5.5, -15, 5.5, 0, Math.PI*2);
  ctx.fill();

  if (pugState === 'missed') {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
    [-5.5, 5.5].forEach(ex => {
      ctx.beginPath(); ctx.moveTo(ex-3,-18); ctx.lineTo(ex+3,-12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex+3,-18); ctx.lineTo(ex-3,-12); ctx.stroke();
    });
  } else {
    ctx.fillStyle = '#111';
    const pupilR = pugState === 'bouncing' ? 3.8 : 3.2;
    ctx.beginPath();
    ctx.arc(-5.5, -15, pupilR, 0, Math.PI*2);
    ctx.arc( 5.5, -15, pupilR, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-4.2, -16, 1.3, 0, Math.PI*2);
    ctx.arc(  6.8, -16, 1.3, 0, Math.PI*2);
    ctx.fill();
    if (pugState === 'falling') {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath();
      ctx.arc(-5.5, -13.5, 1.5, 0, Math.PI*2);
      ctx.arc( 5.5, -13.5, 1.5, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // Nose
  ctx.fillStyle = '#2A1200';
  ctx.beginPath();
  ctx.ellipse(0, -7.5, 4.5, 3, 0, 0, Math.PI*2);
  ctx.fill();

  // Mouth
  ctx.strokeStyle = '#2A1200'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath();
  if      (pugState === 'bouncing') ctx.arc(0, -5, 4.5, 0.15, Math.PI-0.15);
  else if (pugState === 'falling')  ctx.arc(0, -3, 3.5, Math.PI+0.2, -0.2);
  else                              ctx.arc(0, -4.5, 3, Math.PI+0.3, -0.3);
  ctx.stroke();

  // Forehead wrinkles
  ctx.strokeStyle = '#7A5025'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-5,-20); ctx.lineTo(-3,-17);
  ctx.moveTo( 0,-21); ctx.lineTo( 0,-18);
  ctx.moveTo( 5,-20); ctx.lineTo( 3,-17);
  ctx.stroke();

  // Front paws
  ctx.fillStyle = '#C4996A';
  ctx.beginPath();
  ctx.ellipse(-6, 14 - leg*0.3, 4, 6, -0.2, 0, Math.PI*2);
  ctx.ellipse( 6, 14 + leg*0.3, 4, 6,  0.2, 0, Math.PI*2);
  ctx.fill();
}

// ----- Draw Building -----
let flameT = 0;
function drawBuilding() {
  flameT += 0.18;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(BUILDING_X+8, BUILDING_Y+8, BUILDING_W, BUILDING_H);

  // Main walls
  const wg = ctx.createLinearGradient(BUILDING_X, 0, BUILDING_X+BUILDING_W, 0);
  wg.addColorStop(0,   '#7a5a3d');
  wg.addColorStop(0.5, '#8d6a49');
  wg.addColorStop(1,   '#6a4a30');
  ctx.fillStyle = wg;
  ctx.fillRect(BUILDING_X, BUILDING_Y, BUILDING_W, BUILDING_H);

  // Brick pattern
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1;
  for (let r = 0; r < 13; r++) {
    for (let c = 0; c < 4; c++) {
      const bx = BUILDING_X + c*34 + (r%2 === 0 ? 0 : 17);
      ctx.strokeRect(bx+2, BUILDING_Y+r*34+2, 30, 30);
    }
  }

  // Roof parapet
  ctx.fillStyle = '#9d7a55';
  ctx.fillRect(BUILDING_X-6, BUILDING_Y-14, BUILDING_W+12, 18);
  ctx.fillStyle = '#7a5a3d';
  for (let i = 0; i < 8; i++) {
    ctx.fillRect(BUILDING_X-4+i*19, BUILDING_Y-18, 10, 10);
  }

  // Windows
  WINDOWS.forEach((win, idx) => {
    const burning  = idx >= 6;
    const flickIdx = Math.floor((frame/4 + idx*1.7)) % 4;
    const fireColors = ['#FF5500','#FF7700','#FF9900','#FFCC00'];

    ctx.fillStyle = '#4a2e14';
    ctx.fillRect(win.x-2, win.y-2, 32, 32);
    ctx.fillStyle = burning ? fireColors[flickIdx] : '#1a1a35';
    ctx.fillRect(win.x, win.y, 28, 28);
    ctx.strokeStyle = burning ? 'rgba(180,60,0,0.6)' : 'rgba(60,60,120,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(win.x+14, win.y);    ctx.lineTo(win.x+14, win.y+28);
    ctx.moveTo(win.x,    win.y+14); ctx.lineTo(win.x+28, win.y+14);
    ctx.stroke();
  });

  // Roof flames
  [10,30,52,74,96,118].forEach((dx, i) => {
    const fx   = BUILDING_X + dx;
    const wave = Math.sin(flameT + i*0.9) * 9;
    const h    = 28 + Math.sin(flameT*1.2 + i) * 14;

    ctx.fillStyle = 'rgba(255,70,0,0.9)';
    ctx.beginPath();
    ctx.moveTo(fx, BUILDING_Y-4);
    ctx.quadraticCurveTo(fx-10+wave, BUILDING_Y-h*0.55, fx+2,  BUILDING_Y-h);
    ctx.quadraticCurveTo(fx+12+wave, BUILDING_Y-h*0.55, fx+20, BUILDING_Y-4);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = 'rgba(255,220,0,0.85)';
    ctx.beginPath();
    ctx.moveTo(fx+5, BUILDING_Y-4);
    ctx.quadraticCurveTo(fx-2+wave, BUILDING_Y-h*0.38, fx+5,  BUILDING_Y-h*0.62);
    ctx.quadraticCurveTo(fx+13+wave,BUILDING_Y-h*0.38, fx+15, BUILDING_Y-4);
    ctx.closePath(); ctx.fill();
  });
}

// ----- Draw Ambulance -----
function drawAmbulance() {
  const ax=AMBULANCE_X, ay=AMBULANCE_Y, aw=AMBULANCE_W, ah=AMBULANCE_H;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(ax+aw*0.5, ay+ah*0.82+5, aw*0.42, 8, 0, 0, Math.PI*2);
  ctx.fill();

  // Body
  ctx.fillStyle = '#E53935';
  ctx.beginPath(); ctx.roundRect(ax, ay+ah*0.12, aw, ah*0.72, 6); ctx.fill();

  // Cab
  ctx.fillStyle = '#EF5350';
  ctx.beginPath(); ctx.roundRect(ax+aw*0.04, ay-ah*0.12, aw*0.52, ah*0.3, [8,8,0,0]); ctx.fill();

  // Windshield
  ctx.fillStyle = '#90CAF9';
  ctx.beginPath(); ctx.roundRect(ax+aw*0.08, ay-ah*0.06, aw*0.4, ah*0.22, 4); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.roundRect(ax+aw*0.1, ay-ah*0.04, aw*0.15, ah*0.1, 2); ctx.fill();

  // White panel
  ctx.fillStyle = 'white';
  ctx.fillRect(ax+aw*0.56, ay+ah*0.14, aw*0.38, ah*0.54);

  // Cross
  ctx.fillStyle = '#E53935';
  const cx=ax+aw*0.67, cy=ay+ah*0.24, cs=aw*0.13;
  ctx.fillRect(cx-cs*0.35, cy-cs,      cs*0.7, cs*2);
  ctx.fillRect(cx-cs,      cy-cs*0.35, cs*2,   cs*0.7);

  // Label
  ctx.fillStyle = '#333'; ctx.font = 'bold 8px Courier New'; ctx.textAlign = 'center';
  ctx.fillText('MOPS',    ax+aw*0.74, ay+ah*0.62);
  ctx.fillText('RETTUNG', ax+aw*0.74, ay+ah*0.72);

  // Wheels
  [[aw*0.18,ah*0.82],[aw*0.78,ah*0.82]].forEach(([wx,wy]) => {
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(ax+wx,ay+wy,11,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(ax+wx,ay+wy, 6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(ax+wx,ay+wy, 2,0,Math.PI*2); ctx.fill();
  });

  // Siren
  const fl = Math.floor(frame/12)%2;
  ctx.fillStyle = fl ? '#FF1744' : '#2979FF';
  ctx.beginPath(); ctx.roundRect(ax+8,  ay-ah*0.22, 14, 8, 3); ctx.fill();
  ctx.fillStyle = fl ? '#2979FF' : '#FF1744';
  ctx.beginPath(); ctx.roundRect(ax+26, ay-ah*0.22, 14, 8, 3); ctx.fill();
}

// ----- Draw Trampoline -----
function drawTrampoline() {
  const tx=tramp.x, ty=tramp.y, tw=TRAMP_W, th=TRAMP_H;
  const bo = tramp.bounce > 0 ? Math.sin(tramp.bounce*0.45)*6 : 0;
  tramp.bounce = Math.max(0, tramp.bounce-1);

  drawHelper(tx-12,    ty+bo, false);
  drawHelper(tx+tw+12, ty+bo, true);

  ctx.save();
  ctx.translate(0, bo);

  const sg = ctx.createLinearGradient(tx, ty, tx, ty+th);
  sg.addColorStop(0,   '#69F0AE');
  sg.addColorStop(0.5, '#00C853');
  sg.addColorStop(1,   '#1B5E20');
  ctx.fillStyle = sg;

  ctx.beginPath();
  if (tramp.bounce > 0) {
    const dip = Math.sin(tramp.bounce*0.45)*6;
    ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx+tw/2, ty+dip+4,    tx+tw, ty);
    ctx.lineTo(tx+tw, ty+th);
    ctx.quadraticCurveTo(tx+tw/2, ty+th+dip+4, tx,    ty+th);
    ctx.closePath();
  } else {
    ctx.roundRect(tx, ty, tw, th, 5);
  }
  ctx.fill();

  ctx.strokeStyle = '#00701A'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
  for (let i = 1; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(tx+(tw/5)*i, ty+3);
    ctx.lineTo(tx+(tw/5)*i, ty+th-3);
    ctx.stroke();
  }
  ctx.restore();
}

function drawHelper(x, y, flip) {
  ctx.save();
  ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);

  ctx.fillStyle = '#1565C0'; ctx.fillRect(-5, -5, 10, 18);
  ctx.fillStyle = '#333';
  ctx.fillRect(-6, 10, 7, 8);
  ctx.fillRect( 1, 10, 7, 8);
  ctx.fillStyle = '#1E88E5'; ctx.fillRect(-9, -20, 18, 18);
  ctx.fillStyle = '#FFC107'; ctx.fillRect(-9, -12, 18, 4);
  ctx.fillStyle = '#FFCC80';
  ctx.beginPath(); ctx.arc(0, -28, 9, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#F57F17';
  ctx.beginPath(); ctx.arc(0, -32, 10, Math.PI, Math.PI*2); ctx.fill();
  ctx.fillRect(-12, -33, 24, 6);
  ctx.fillStyle = '#E65100'; ctx.fillRect(-14, -28, 28, 4);
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(-3, -29, 2, 0, Math.PI*2);
  ctx.arc( 3, -29, 2, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#1565C0'; ctx.fillRect(6, -18, 14, 7);
  ctx.fillStyle = '#FFCC80';
  ctx.beginPath(); ctx.arc(20, -14, 5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ----- Draw Background -----
function drawBackground() {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, BUILDING_Y+60);
  skyGrad.addColorStop(0,   '#050520');
  skyGrad.addColorStop(0.7, '#120a38');
  skyGrad.addColorStop(1,   '#1a1050');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, BUILDING_Y+60);

  STARS.forEach(s => {
    s.phase += s.speed;
    ctx.globalAlpha = 0.45 + 0.55*Math.sin(s.phase);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Moon
  ctx.fillStyle = '#FFFDE7'; ctx.beginPath(); ctx.arc(44, 42, 22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#F5F5DC'; ctx.beginPath(); ctx.arc(54, 36, 18, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.3; ctx.fillStyle = '#999';
  [[38,48,4],[30,40,3],[45,55,2]].forEach(([cx,cy,cr]) => {
    ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  const gGrad = ctx.createLinearGradient(0, GROUND_Y-30, 0, H);
  gGrad.addColorStop(0,   '#1c3310');
  gGrad.addColorStop(0.2, '#2d4a1e');
  gGrad.addColorStop(1,   '#111f0a');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, GROUND_Y-28, W, H-(GROUND_Y-28));

  ctx.fillStyle = '#3d6428'; ctx.fillRect(0, GROUND_Y-28, W, 10);
  ctx.fillStyle = '#4d7a30';
  for (let gx = 5; gx < W; gx += 18) {
    ctx.beginPath();
    ctx.moveTo(gx,   GROUND_Y-20);
    ctx.lineTo(gx+4, GROUND_Y-34);
    ctx.lineTo(gx+9, GROUND_Y-20);
    ctx.fill();
  }
}

// ----- Draw HUD -----
function drawUI() {
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, 62);
  ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0,62); ctx.lineTo(W,62); ctx.stroke();

  // Badge
  ctx.fillStyle = '#2a2050';
  ctx.beginPath(); ctx.roundRect(W/2-65, 5, 130, 20, 5); ctx.fill();
  ctx.fillStyle = '#FFD700'; ctx.font = 'bold 10px Courier New'; ctx.textAlign = 'center';
  ctx.fillText('★  GAME & WUFF  ★', W/2, 19);

  // Level
  ctx.fillStyle = level >= 5 ? '#FF5722' : level >= 3 ? '#FF9800' : '#8BC34A';
  ctx.font = 'bold 10px Courier New'; ctx.textAlign = 'center';
  ctx.fillText('LVL ' + level, W/2, 50);

  // Score
  ctx.fillStyle = '#FFD700'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'left';
  ctx.fillText('PUNKTE', 10, 36);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Courier New';
  ctx.fillText(String(score).padStart(5,'0'), 10, 56);
  ctx.fillStyle = '#aaaaff'; ctx.font = '10px Courier New';
  ctx.fillText('BEST:' + String(highScore).padStart(5,'0'), 12, 22);

  // Lives
  ctx.fillStyle = '#FF69B4'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'right';
  ctx.fillText('LEBEN', W-10, 36);
  for (let i = 0; i < 3; i++) {
    ctx.globalAlpha = (i < lives) ? 1 : 0.18;
    ctx.font = '20px Arial'; ctx.textAlign = 'right';
    ctx.fillText('🐾', W-8-i*28, 58);
  }
  ctx.globalAlpha = 1;
}

// ----- Draw Controls -----
function drawControls() {
  const btnY = GROUND_Y + 12;
  const btnH = H - btnY - 8;

  ctx.fillStyle = tramp.leftDown ? '#404070' : '#252545';
  ctx.beginPath(); ctx.roundRect(8, btnY, W/2-12, btnH, 14); ctx.fill();
  ctx.strokeStyle = tramp.leftDown ? '#8888cc' : '#505080'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = tramp.leftDown ? '#ccceff' : '#8888cc';
  ctx.font = 'bold 38px Arial'; ctx.textAlign = 'center';
  ctx.fillText('◄', W/4, btnY + btnH*0.65);

  ctx.fillStyle = tramp.rightDown ? '#404070' : '#252545';
  ctx.beginPath(); ctx.roundRect(W/2+4, btnY, W/2-12, btnH, 14); ctx.fill();
  ctx.strokeStyle = tramp.rightDown ? '#8888cc' : '#505080'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = tramp.rightDown ? '#ccceff' : '#8888cc';
  ctx.textAlign = 'center';
  ctx.fillText('►', W*3/4, btnY + btnH*0.65);
}

// ----- Draw Particles -----
function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = (p.life/p.max)*0.9;
    ctx.fillStyle   = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function updateDrawFloats() {
  floats.forEach(f => {
    f.y -= 0.9; f.life--;
    ctx.globalAlpha = f.life / f.max;
    ctx.fillStyle   = f.color;
    ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;
  floats = floats.filter(f => f.life > 0);
}

// ----- Menu -----
let menuPugs = [];
function drawMenu() {
  drawBackground();
  if (frame % 90 === 0) {
    menuPugs.push({x:40+Math.random()*(W-80), y:-30, vy:1.2+Math.random()*0.8, rot:0, vrot:(Math.random()-0.5)*0.1});
  }
  menuPugs.forEach(p => { p.y+=p.vy; p.rot+=p.vrot; });
  menuPugs = menuPugs.filter(p => p.y < H+60);
  ctx.globalAlpha = 0.25;
  menuPugs.forEach(p => {
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    drawPug('falling', frame); ctx.restore();
  });
  ctx.globalAlpha = 1;

  ctx.fillStyle = 'rgba(8,6,30,0.88)';
  ctx.beginPath(); ctx.roundRect(18, H*0.18, W-36, H*0.62, 22); ctx.fill();
  ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 3; ctx.stroke();

  ctx.fillStyle = '#FFD700'; ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'center';
  ctx.fillText('★   GAME & WUFF   ★', W/2, H*0.22);

  ctx.shadowColor='#FF4500'; ctx.shadowBlur=20;
  ctx.fillStyle='#FF6B35'; ctx.font='bold 52px Arial';
  ctx.fillText('MOPS', W/2, H*0.34);
  ctx.fillStyle='#FFD700'; ctx.font='bold 40px Arial';
  ctx.fillText('RETTUNG!', W/2, H*0.42);
  ctx.shadowBlur=0;

  const bob = Math.sin(frame*0.06)*6;
  ctx.save(); ctx.translate(W/2, H*0.535+bob); drawPug('bouncing', frame); ctx.restore();

  ctx.fillStyle='#aaaaff'; ctx.font='bold 13px Courier New'; ctx.textAlign='center';
  ctx.fillText('BESTPUNKTZAHL: ' + String(highScore).padStart(5,'0'), W/2, H*0.635);

  const pulse = Math.sin(frame*0.09)*0.12+0.88;
  ctx.fillStyle = `rgba(0,200,90,${pulse})`;
  ctx.beginPath(); ctx.roundRect(W/2-88, H*0.665, 176, 52, 26); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 20px Arial';
  ctx.fillText('🐾  SPIELEN!  🐾', W/2, H*0.665+34);

  ctx.fillStyle='#888'; ctx.font='11px Courier New';
  ctx.fillText('Halte ◄ oder ► um das Sprungbrett', W/2, H*0.79);
  ctx.fillText('zu bewegen und Möpse zu retten!', W/2, H*0.79+16);
}

// ----- Game Over -----
function drawGameOver() {
  ctx.fillStyle='rgba(0,0,0,0.78)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(10,8,40,0.95)';
  ctx.beginPath(); ctx.roundRect(28, H*0.22, W-56, H*0.54, 22); ctx.fill();
  ctx.strokeStyle='#F44336'; ctx.lineWidth=3; ctx.stroke();

  const sadBob = Math.sin(frame*0.04)*3;
  ctx.save(); ctx.translate(W/2, H*0.32+sadBob); drawPug('missed', frame); ctx.restore();

  ctx.shadowColor='#FF1744'; ctx.shadowBlur=12;
  ctx.fillStyle='#F44336'; ctx.font='bold 34px Arial'; ctx.textAlign='center';
  ctx.fillText('KEIN GLÜCK!', W/2, H*0.44);
  ctx.shadowBlur=0;

  ctx.fillStyle='#FFD700'; ctx.font='bold 16px Courier New';
  ctx.fillText('PUNKTE: ' + score, W/2, H*0.51);

  if (score >= highScore && score > 0) {
    ctx.globalAlpha = Math.sin(frame*0.12)*0.35+0.65;
    ctx.fillStyle='#69F0AE'; ctx.font='bold 15px Courier New';
    ctx.fillText('★ NEUER REKORD! ★', W/2, H*0.57);
    ctx.globalAlpha=1;
  } else {
    ctx.fillStyle='#aaaaff'; ctx.font='13px Courier New';
    ctx.fillText('REKORD: ' + String(highScore).padStart(5,'0'), W/2, H*0.57);
  }

  const pulse=Math.sin(frame*0.09)*0.12+0.88;
  ctx.fillStyle=`rgba(0,200,90,${pulse})`;
  ctx.beginPath(); ctx.roundRect(W/2-96, H*0.61, 192, 52, 26); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 20px Arial';
  ctx.fillText('🐾  NOCHMAL!  🐾', W/2, H*0.61+34);
}

// ----- Collision: trampoline -----
function checkTrampCollision() {
  pugs.forEach(pug => {
    if (pug.state !== 'falling') return;
    const tx=tramp.x, tw=TRAMP_W, ty=TRAMP_Y;
    if (pug.x < tx-8 || pug.x > tx+tw+8) return;
    if (pug.y+18 < ty-2 || pug.y+18 > ty+TRAMP_H+10) return;
    if (pug.vy <= 0) return;

    const relPos   = Math.max(0, Math.min(1, (pug.x - tx) / tw));
    pug.state      = 'bouncing';
    pug.vx         = -(3.5 + relPos*1.5 + Math.random()*0.4);
    pug.vy         = -(8.5 + Math.random()*1.5 + level*0.25);
    pug.vrot       = -(Math.random()*0.12+0.04);
    tramp.bounce   = 22;
    sfxBounce();
    addParticles(pug.x, ty, ['#69F0AE','#00C853','#fff'], 7);
    addFloat(pug.x, ty-10, 'WUFF!', '#69F0AE');
  });
}

// ----- Update -----
let pugs = [];
function updateGame() {
  frame++;

  if (tramp.leftDown)  tramp.x = Math.max(TRAMP_MIN_X, tramp.x - TRAMP_SPEED);
  if (tramp.rightDown) tramp.x = Math.min(TRAMP_MAX_X, tramp.x + TRAMP_SPEED);

  spawnTimer++;
  if (spawnTimer >= spawnEvery) {
    spawnTimer = 0;
    const win = WINDOWS[Math.floor(Math.random() * WINDOWS.length)];
    pugs.push(new Pug(win));
    spawnEvery = Math.max(55, 148 - score*0.35 - missedCount*3);
  }

  pugs.forEach(pug => {
    pug.update();
    if ((pug.state === 'saved' || pug.state === 'missed') && !pug.counted) {
      const result = pug.consume();
      if (result === 'saved') {
        const pts = 10 * level;
        score += pts;
        addParticles(AMBULANCE_X+AMBULANCE_W*0.5, AMBULANCE_Y+20,
          ['#FFD700','#FF69B4','#69F0AE','#87CEEB'], 14);
        addFloat(AMBULANCE_X+AMBULANCE_W*0.5, AMBULANCE_Y, '+'+pts, '#FFD700');
        sfxSave();
        const newLevel = Math.floor(score/80)+1;
        if (newLevel > level) {
          level = newLevel;
          sfxLevelUp();
          addFloat(W/2, H/2, 'LEVEL '+level+'!', '#FF69B4');
        }
      } else if (result === 'missed') {
        missedCount++;
        lives--;
        addParticles(pug.x, GROUND_Y, ['#F44336','#FF5722','#FF7043'], 9);
        addFloat(pug.x, GROUND_Y-30, 'UFFZ!', '#F44336');
        sfxMiss();
        if (lives <= 0) {
          state = 'gameover';
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('mopsHigh', highScore);
          }
        }
      }
    }
  });

  pugs = pugs.filter(p => !p.done());
  checkTrampCollision();

  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.22; p.life--; });
  particles = particles.filter(p => p.life > 0);
}

// ----- Start / Reset -----
function startGame() {
  sfxStart();
  score       = 0;
  lives       = 3;
  level       = 1;
  frame       = 0;
  spawnTimer  = 0;
  spawnEvery  = 148;
  missedCount = 0;
  pugs        = [];
  particles   = [];
  floats      = [];
  tramp.x          = W/2 - TRAMP_W/2;
  tramp.bounce     = 0;
  tramp.leftDown   = false;
  tramp.rightDown  = false;
  state = 'playing';
}

// ----- Main Draw Loop -----
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'menu') { drawMenu(); return; }

  drawBackground();
  drawBuilding();
  drawAmbulance();
  drawTrampoline();
  pugs.forEach(p => p.draw());
  drawParticles();
  updateDrawFloats();
  drawUI();
  drawControls();
  if (state === 'gameover') drawGameOver();
}

function loop() {
  if (state === 'playing') updateGame();
  else frame++;
  draw();
  requestAnimationFrame(loop);
}

// ----- Input: Keyboard -----
document.addEventListener('keydown', e => {
  if (e.key==='ArrowLeft'  || e.key==='a'||e.key==='A') tramp.leftDown  = true;
  if (e.key==='ArrowRight' || e.key==='d'||e.key==='D') tramp.rightDown = true;
  if ((e.key===' '||e.key==='Enter') && (state==='menu'||state==='gameover')) startGame();
});
document.addEventListener('keyup', e => {
  if (e.key==='ArrowLeft'  || e.key==='a'||e.key==='A') tramp.leftDown  = false;
  if (e.key==='ArrowRight' || e.key==='d'||e.key==='D') tramp.rightDown = false;
});

// ----- Input: Touch -----
function canvasXY(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return { x:(cx-r.left)*(W/r.width), y:(cy-r.top)*(H/r.height) };
}

const activeTouches = new Map();

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state==='menu'||state==='gameover') { startGame(); return; }
  [...e.changedTouches].forEach(t => {
    const {x} = canvasXY(t.clientX, t.clientY);
    const side = x < W/2 ? 'left' : 'right';
    activeTouches.set(t.identifier, side);
    if (side==='left') tramp.leftDown=true; else tramp.rightDown=true;
  });
}, {passive:false});

function syncTouches() {
  let l=false, r=false;
  activeTouches.forEach(s => { if(s==='left') l=true; if(s==='right') r=true; });
  tramp.leftDown=l; tramp.rightDown=r;
}

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  [...e.changedTouches].forEach(t => activeTouches.delete(t.identifier));
  syncTouches();
}, {passive:false});

canvas.addEventListener('touchcancel', e => {
  e.preventDefault();
  [...e.changedTouches].forEach(t => activeTouches.delete(t.identifier));
  syncTouches();
}, {passive:false});

// ----- Mouse (Desktop) -----
canvas.addEventListener('mousedown', e => {
  if (state!=='playing') { startGame(); return; }
  const {x}=canvasXY(e.clientX,e.clientY);
  if (x<W/2) tramp.leftDown=true; else tramp.rightDown=true;
});
canvas.addEventListener('mouseup',    () => { tramp.leftDown=tramp.rightDown=false; });
canvas.addEventListener('mouseleave', () => { tramp.leftDown=tramp.rightDown=false; });

// ----- Start! -----
loop();
</script>
